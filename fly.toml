app = "cryptoportfolio-alerts"
primary_region = "fra"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "/app/api --version || true"

[processes]
  api    = "/app/api"
  worker = "/app/worker"

[env]
  PORT                     = "8080"
  COINGECKO_BASE_URL       = "https://api.coingecko.com/api/v3"
  WORKER_INTERVAL_SECONDS  = "60"
  WORKER_CURRENCY          = "usd"
  MIGRATIONS_PATH          = "/app/migrations"

# --- API service: HTTP traffic ---
[[services]]
  protocol      = "tcp"
  internal_port = 8080
  processes     = ["api"]

  [services.concurrency]
    type       = "connections"
    hard_limit = 250
    soft_limit = 200

  [[services.ports]]
    port     = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port     = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval     = "15s"
    timeout      = "2s"
    grace_period = "5s"

  [[services.http_checks]]
    interval      = "30s"
    timeout       = "5s"
    grace_period  = "10s"
    method        = "get"
    path          = "/health"
    protocol      = "http"

# --- API VM sizing ---
[[vm]]
  size       = "shared-cpu-1x"
  memory_mb  = 256
  processes  = ["api"]

# --- Worker VM sizing (smaller — no traffic) ---
[[vm]]
  size       = "shared-cpu-1x"
  memory_mb  = 256
  processes  = ["worker"]
